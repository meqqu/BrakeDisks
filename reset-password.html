<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — MotoBrake Discs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:var(--color-bg); }
    .box { background:var(--color-surface); border-radius:16px; border:1px solid var(--color-border); overflow:hidden; width:100%; max-width:420px; }
    .box-header { background:linear-gradient(135deg,#7c3aed,#4f46e5); padding:2rem 2rem 1.5rem; }
    .box-header h1 { margin:0; color:var(--color-text-bright); font-size:1.4rem; font-weight:800; }
    .box-header p { margin:0.3rem 0 0; color:var(--color-muted); font-size:0.85rem; }
    .box-body { padding:2rem; }
    .field { margin-bottom:1.2rem; }
    .field label { display:block; font-size:0.8rem; font-weight:600; color:var(--color-muted); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:0.5rem; }
    .field input { width:100%; padding:0.85rem 1rem; border-radius:10px; border:1px solid var(--color-border); background:var(--color-input-bg); color:var(--color-text-bright); font-family:inherit; font-size:0.95rem; box-sizing:border-box; transition:border-color 0.2s; }
    .field input:focus { outline:none; border-color:#7c3aed; }
    .btn-primary { width:100%; padding:0.9rem; border-radius:10px; border:none; background:linear-gradient(135deg,#7c3aed,#4f46e5); color:#fff; font-family:inherit; font-size:1rem; font-weight:700; cursor:pointer; transition:opacity 0.2s; }
    .btn-primary:hover { opacity:0.9; }
    .msg { padding:0.8rem 1rem; border-radius:8px; margin-bottom:1rem; font-size:0.9rem; font-weight:600; display:none; }
    .msg.success { background:rgba(0,230,118,0.1); border-left:4px solid #00e676; color:#00e676; }
    .msg.error { background:rgba(255,82,82,0.1); border-left:4px solid #ff5252; color:#ff7070; }
  </style>
</head>
<body>
  <div class="box">
    <div class="box-header">
      <div style="font-size:2rem;margin-bottom:0.5rem;">🔑</div>
      <h1>Set New Password</h1>
      <p>Enter your new password below</p>
    </div>
    <div class="box-body">
      <div id="statusMsg" class="msg"></div>
      <form id="resetForm">
        <div class="field">
          <label>New Password</label>
          <input type="password" id="newPass" placeholder="At least 6 characters" minlength="6" required />
        </div>
        <div class="field">
          <label>Confirm Password</label>
          <input type="password" id="confirmPass" placeholder="Repeat your new password" required />
        </div>
        <button type="submit" class="btn-primary">💾 Save New Password</button>
      </form>
      <div style="margin-top:1.5rem; text-align:center;">
        <a href="/" style="color:#7c3aed; font-size:0.9rem; text-decoration:none;">← Back to shop</a>
      </div>
    </div>
  </div>

  <script>
    const token = new URLSearchParams(window.location.search).get('token');
    const msg = document.getElementById('statusMsg');

    function showMsg(text, type) {
      msg.textContent = text;
      msg.className = 'msg ' + type;
      msg.style.display = 'block';
    }

    if (!token) {
      showMsg('Invalid link. Please request a new password reset.', 'error');
      document.getElementById('resetForm').style.display = 'none';
    }

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const np = document.getElementById('newPass').value;
      const cp = document.getElementById('confirmPass').value;
      if (np !== cp) { showMsg('Passwords do not match.', 'error'); return; }

      const btn = e.target.querySelector('button');
      btn.disabled = true;
      btn.textContent = 'Saving...';

      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword: np })
        });
        const data = await res.json();
        if (res.ok) {
          showMsg('✅ ' + data.message, 'success');
          document.getElementById('resetForm').style.display = 'none';
          setTimeout(() => window.location.href = '/', 2500);
        } else {
          showMsg('❌ ' + data.error, 'error');
          btn.disabled = false;
          btn.textContent = '💾 Save New Password';
        }
      } catch {
        showMsg('❌ Server error. Please try again.', 'error');
        btn.disabled = false;
        btn.textContent = '💾 Save New Password';
      }
    });
  </script>
</body>
</html>
