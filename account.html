<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Личный кабинет</title>
  <meta name="description" content="Личный кабинет пользователя магазина тормозных дисков" />
  <link rel="stylesheet" href="/style.css?v=7" />
</head>
<body>
  <!-- Toast Notification Overlay -->
  <div id="toastNotification" class="toast-notification">
    <span id="toastIcon">🔔</span>
    <span id="toastText">Уведомление</span>
  </div>

  <!-- Point 6: Edit Order Modal -->
  <div class="modal" id="editOrderModal" style="display:none;">
    <div class="modal-content" style="max-width:480px;">
      <h2 style="color:var(--color-primary-start); margin-bottom:1.5rem;">Редактировать заказ</h2>
      <form id="editOrderForm" style="display:flex; flex-direction:column; gap:1rem;">
        <input type="hidden" id="editOrderId" />
        
        <div style="display:flex; flex-direction:column; gap:0.3rem;">
          <label style="font-size:0.85rem; color:#aaa;">Адрес доставки</label>
          <input type="text" id="editOrderAddress" required style="padding:0.8rem; border-radius:var(--radius); border:1px solid #444; background:var(--color-bg); color:#fff;" />
        </div>
        
        <div style="display:flex; flex-direction:column; gap:0.3rem;">
          <label style="font-size:0.85rem; color:#aaa;">Комментарий к заказу</label>
          <textarea id="editOrderComment" style="padding:0.8rem; min-height:80px; border-radius:var(--radius); border:1px solid #444; background:var(--color-bg); color:#fff; font-family:inherit;"></textarea>
        </div>
        
        <div style="display:flex; gap:0.5rem; flex-wrap:wrap;">
          <div style="flex:1; min-width:180px; display:flex; flex-direction:column; gap:0.3rem;">
            <label style="font-size:0.85rem; color:#aaa;">Способ связи</label>
            <select id="editOrderPreferred" style="padding:0.8rem; border-radius:var(--radius); border:1px solid #444; background:var(--color-bg); color:#fff; height:45px;">
              <option value="Telegram">Telegram</option>
              <option value="WhatsApp">WhatsApp</option>
              <option value="Email">Email</option>
              <option value="Телефон">Телефон</option>
              <option value="Facebook">Facebook</option>
            </select>
          </div>
          <div style="flex:1; min-width:180px; display:flex; flex-direction:column; gap:0.3rem;">
            <label style="font-size:0.85rem; color:#aaa;">Контактные данные</label>
            <input type="text" id="editOrderContactValue" required style="padding:0.8rem; border-radius:var(--radius); border:1px solid #444; background:var(--color-bg); color:#fff; height:45px;" />
          </div>
        </div>
        
        <button type="submit" style="background:linear-gradient(135deg, var(--color-primary-start), var(--color-primary-end)); color:#fff; border:none; padding:1rem; border-radius:var(--radius); cursor:pointer; font-weight:bold; margin-top:0.5rem;">Сохранить изменения</button>
        <button type="button" id="closeEditOrderModal" style="background:transparent; color:#fff; border:1px solid #444; padding:0.8rem; border-radius:var(--radius); cursor:pointer; text-align:center;">Отмена</button>
      </form>
    </div>
  </div>

  <header class="header">
    <h1 class="logo">👤 Личный кабинет</h1>
    <nav class="nav">
      <a href="/index.html" class="nav-link">← Вернуться в магазин</a>
    </nav>
  </header>

  <main class="main" style="max-width: 900px; margin: 2rem auto; display: flex; flex-direction: column; gap: 2rem;">
    <!-- Profile Tabs -->
    <div class="account-tabs" style="display:flex; gap:1rem; border-bottom: 1px solid var(--color-muted); padding-bottom:1rem;">
      <button class="account-tab active" id="tabProfile">Мой профиль</button>
      <button class="account-tab" id="tabOrders">Мои заказы</button>
      <button class="account-tab" id="tabSupport">Поддержка (Диалоги)</button>
    </div>

    <!-- Profile Section -->
    <section id="profileSection" class="account-section active">
      <div class="profile-card" style="background: var(--color-surface); padding: 2rem; border-radius: var(--radius); box-shadow: var(--shadow);">
        <h2 style="color:var(--color-primary-start); margin-bottom: 1.5rem;">Настройки профиля</h2>
        <form id="profileForm" class="profile-form" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
          
          <!-- Point 5: Split first and last name fields -->
          <div style="display:flex; flex-direction:column; gap:0.5rem;">
            <label style="color:#aaa; font-size:0.9rem;">Имя</label>
            <input type="text" id="userFirstName" placeholder="Иван" required style="padding:0.8rem; border-radius:var(--radius); border:1px solid var(--color-muted); background:var(--color-bg); color:var(--color-text);" />
          </div>
          <div style="display:flex; flex-direction:column; gap:0.5rem;">
            <label style="color:#aaa; font-size:0.9rem;">Фамилия</label>
            <input type="text" id="userLastName" placeholder="Иванов" required style="padding:0.8rem; border-radius:var(--radius); border:1px solid var(--color-muted); background:var(--color-bg); color:var(--color-text);" />
          </div>
          
          <div style="display:flex; flex-direction:column; gap:0.5rem;">
            <label style="color:#aaa; font-size:0.9rem;">Email</label>
            <input type="email" id="userEmail" placeholder="ivan@example.com" required style="padding:0.8rem; border-radius:var(--radius); border:1px solid var(--color-muted); background:var(--color-bg); color:var(--color-text);" />
          </div>
          <div style="display:flex; flex-direction:column; gap:0.5rem;">
            <label style="color:#aaa; font-size:0.9rem;">Телефон</label>
            <input type="tel" id="userPhone" placeholder="+7 999 000-00-00" style="padding:0.8rem; border-radius:var(--radius); border:1px solid var(--color-muted); background:var(--color-bg); color:var(--color-text);" />
          </div>

          <!-- Point 5: Structured Social Networks Container -->
          <div style="grid-column: 1 / -1; display:flex; flex-direction:column; gap:0.5rem; margin-top:0.5rem;">
            <label style="color:#aaa; font-size:0.95rem; font-weight:bold;">Социальные сети и связь</label>
            <div class="social-group-container">
              <div style="display:flex; flex-direction:column; gap:0.3rem;">
                <label style="color:#aaa; font-size:0.8rem;">Telegram</label>
                <input type="text" id="userTelegram" placeholder="@username" style="padding:0.8rem; border-radius:var(--radius); border:1px solid var(--color-muted); background:var(--color-bg); color:var(--color-text);" />
              </div>
              <div style="display:flex; flex-direction:column; gap:0.3rem;">
                <label style="color:#aaa; font-size:0.8rem;">WhatsApp</label>
                <input type="text" id="userWhatsApp" placeholder="+7 999 000-00-00" style="padding:0.8rem; border-radius:var(--radius); border:1px solid var(--color-muted); background:var(--color-bg); color:var(--color-text);" />
              </div>
              <div style="display:flex; flex-direction:column; gap:0.3rem;">
                <label style="color:#aaa; font-size:0.8rem;">Facebook</label>
                <input type="text" id="userFacebook" placeholder="Ссылка или имя профиля" style="padding:0.8rem; border-radius:var(--radius); border:1px solid var(--color-muted); background:var(--color-bg); color:var(--color-text);" />
              </div>
              <div style="display:flex; flex-direction:column; gap:0.3rem;">
                <label style="color:#aaa; font-size:0.8rem;">Способ связи</label>
                <select id="userPreferredContact" style="padding:0.8rem; border-radius:var(--radius); border:1px solid var(--color-muted); background:var(--color-bg); color:var(--color-text); height:45px;">
                  <option value="">Не выбран</option>
                  <option value="Telegram">Telegram</option>
                  <option value="WhatsApp">WhatsApp</option>
                  <option value="Email">Email</option>
                  <option value="Телефон">Телефон</option>
                  <option value="Facebook">Facebook</option>
                </select>
              </div>
            </div>
          </div>

          <div style="grid-column: 1 / -1; display:flex; flex-direction:column; gap:0.5rem;">
            <label style="color:#aaa; font-size:0.9rem;">Адрес доставки</label>
            <input type="text" id="userAddress" placeholder="г. Москва, ул. Ленина, д. 1, кв. 1" required style="padding:0.8rem; border-radius:var(--radius); border:1px solid var(--color-muted); background:var(--color-bg); color:var(--color-text);" />
          </div>
          <button type="submit" style="grid-column: 1 / -1; background:linear-gradient(135deg, var(--color-primary-start), var(--color-primary-end)); color:#fff; border:none; padding:1rem; border-radius:var(--radius); font-size:1.1rem; font-weight:bold; cursor:pointer;">Сохранить изменения</button>
        </form>
      </div>
    </section>

    <!-- Orders Section -->
    <section id="ordersSection" class="account-section" style="display:none;">
      <h2 style="margin-bottom: 1.5rem;">История заказов</h2>
      <div id="ordersList" style="display:flex; flex-direction:column; gap:1.5rem;">Загрузка заказов...</div>
    </section>

    <!-- Support / Chat Section -->
    <section id="supportSection" class="account-section" style="display:none; height:600px;">
      <div style="display:flex; flex-direction:column; background:var(--color-surface); border-radius:var(--radius); box-shadow:var(--shadow); height:100%; overflow:hidden;">
        <div style="background:var(--color-primary-start); padding:1rem; font-weight:bold; color:#fff; display:flex; justify-content:space-between; align-items:center;">
          <span>Служба поддержки</span>
          <select id="chatManufacturerSelect" style="padding:0.4rem; border-radius:var(--radius); border:none; background:rgba(0,0,0,0.3); color:#fff; font-weight:bold; outline:none; cursor:pointer;">
            <option value="BrakeDiscs Official">BrakeDiscs Official</option>
          </select>
        </div>
        <div id="chatMessages" style="flex:1; overflow-y:auto; padding:1rem; display:flex; flex-direction:column; gap:1rem; background:rgba(0,0,0,0.2);">
          <!-- Chat messages injected here -->
        </div>
        
        <!-- Point 7: Attach photos & files to chat -->
        <form id="chatForm" style="display:flex; align-items:center; padding:1rem; background:var(--color-surface); border-top:1px solid var(--color-muted); gap:0.5rem;">
          <label style="cursor:pointer; padding:0.6rem; font-size:1.3rem; color:#aaa; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,0.05); border:1px solid var(--color-muted); border-radius:var(--radius); transition:var(--transition); margin:0;" title="Прикрепить фото или файл">
            📎
            <input type="file" id="chatFile" accept="image/*,application/pdf" style="display:none;" />
          </label>
          <input type="text" id="chatInput" placeholder="Введите ваше сообщение..." required style="flex:1; padding:0.8rem; border-radius:var(--radius); border:1px solid var(--color-muted); background:var(--color-bg); color:var(--color-text);" />
          <button type="submit" style="background:var(--color-primary-start); color:#fff; border:none; padding:0.8rem 1.5rem; border-radius:var(--radius); cursor:pointer; font-weight:bold;">Отправить</button>
        </form>
      </div>
    </section>
  </main>

  <style>
    .account-tab {
      background: transparent;
      color: var(--color-text);
      border: 1px solid var(--color-muted);
      padding: 0.8rem 1.5rem;
      border-radius: var(--radius);
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .account-tab.active {
      background: var(--color-primary-start);
      color: #fff;
      border-color: var(--color-primary-start);
    }
    .account-tab:hover {
      background: rgba(255,82,82, 0.2);
    }
    @media (max-width: 600px) {
      .profile-form { grid-template-columns: 1fr !important; }
      .account-tabs { flex-direction: column; }
    }
    .chat-msg {
      max-width: 75%;
      padding: 0.8rem 1.2rem;
      border-radius: 18px;
      font-size: 0.95rem;
      line-height: 1.4;
    }
    .chat-msg.user {
      align-self: flex-end;
      background: var(--color-primary-start);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .chat-msg.admin {
      align-self: flex-start;
      background: #333;
      color: #fff;
      border-bottom-left-radius: 4px;
    }
    .chat-time {
      font-size: 0.75rem;
      color: rgba(255,255,255,0.6);
      margin-top: 0.4rem;
      text-align: right;
    }
  </style>

  <script type="module" src="/account.js?v=5"></script>
</body>
</html>
