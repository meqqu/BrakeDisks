<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Оформление заказа – Brake Discs Store</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="header">
    <h1 class="logo">Brake Discs Store</h1>
    <nav class="nav" style="margin-left:auto;">
      <a href="index.html" class="nav-link">← Вернуться в магазин</a>
    </nav>
  </header>

  <main class="main" style="max-width:800px; margin:0 auto; display:flex; flex-direction:column; gap:2rem;">
    <h2>Оформление заказа</h2>
    
    <div style="display:flex; gap:2rem; flex-wrap:wrap;">
      <div style="flex:1; min-width:300px; background:var(--color-surface); padding:1.5rem; border-radius:var(--radius); box-shadow:var(--shadow);">
        <h3>Данные для доставки</h3>
        <form id="checkoutForm" style="display:flex; flex-direction:column; gap:1rem; margin-top:1rem;">
          <div style="display:flex; gap:1rem; flex-wrap:nowrap; width:100%;">
            <input type="text" id="chkFirstName" placeholder="Имя" required style="flex:1; padding:0.6rem; border-radius:var(--radius); border:1px solid var(--color-muted); background:var(--color-bg); color:var(--color-text); width:100%; box-sizing:border-box;" />
            <input type="text" id="chkLastName" placeholder="Фамилия" required style="flex:1; padding:0.6rem; border-radius:var(--radius); border:1px solid var(--color-muted); background:var(--color-bg); color:var(--color-text); width:100%; box-sizing:border-box;" />
          </div>
          <input type="email" id="chkEmail" placeholder="Ваш Email (туда придет чек)" required style="width:100%; box-sizing:border-box; padding:0.6rem; border-radius:var(--radius); border:1px solid var(--color-muted); background:var(--color-bg); color:var(--color-text);" />
          <input type="text" id="chkPhone" placeholder="Номер телефона" required style="width:100%; box-sizing:border-box; padding:0.6rem; border-radius:var(--radius); border:1px solid var(--color-muted); background:var(--color-bg); color:var(--color-text);" />
          
          <div style="display:flex; gap:1rem; flex-wrap:nowrap; width:100%;">
            <input type="text" id="chkCountry" placeholder="Страна" required style="flex:1; padding:0.6rem; border-radius:var(--radius); border:1px solid var(--color-muted); background:var(--color-bg); color:var(--color-text); width:100%; box-sizing:border-box;" />
            <input type="text" id="chkCity" placeholder="Город" required style="flex:1; padding:0.6rem; border-radius:var(--radius); border:1px solid var(--color-muted); background:var(--color-bg); color:var(--color-text); width:100%; box-sizing:border-box;" />
          </div>
          <div style="display:flex; gap:1rem; flex-wrap:nowrap; width:100%;">
            <input type="text" id="chkStreet" placeholder="Улица" required style="flex:2; padding:0.6rem; border-radius:var(--radius); border:1px solid var(--color-muted); background:var(--color-bg); color:var(--color-text); width:100%; box-sizing:border-box;" />
            <input type="text" id="chkHouse" placeholder="Дом/Кв" required style="flex:1; padding:0.6rem; border-radius:var(--radius); border:1px solid var(--color-muted); background:var(--color-bg); color:var(--color-text); width:100%; box-sizing:border-box;" />
            <input type="text" id="chkZip" placeholder="ZIP Индекс" required style="flex:1; padding:0.6rem; border-radius:var(--radius); border:1px solid var(--color-muted); background:var(--color-bg); color:var(--color-text); width:100%; box-sizing:border-box;" />
          </div>
          <select id="chkPreferredContact" required style="width:100%; box-sizing:border-box; padding:0.6rem; border-radius:var(--radius); border:1px solid var(--color-muted); background:var(--color-bg); color:var(--color-text);">
            <option value="" disabled selected>Предпочтительный способ связи</option>
            <option value="Telegram">Telegram</option>
            <option value="WhatsApp">WhatsApp</option>
            <option value="Email">Email</option>
            <option value="Телефон">Телефон</option>
            <option value="Facebook">Facebook</option>
          </select>
          <input type="text" id="chkContactValue" placeholder="" style="display:none; width:100%; box-sizing:border-box; padding:0.6rem; border-radius:var(--radius); border:1px solid var(--color-muted); background:var(--color-bg); color:var(--color-text);" />
          <textarea id="chkComment" rows="3" placeholder="Комментарий к заказу (необязательно)" style="width:100%; box-sizing:border-box; padding:0.6rem; border-radius:var(--radius); border:1px solid var(--color-muted); background:var(--color-bg); color:var(--color-text); resize:vertical;"></textarea>
        </form>
      </div>
      
      <div style="flex:1; min-width:300px; background:var(--color-surface); padding:1.5rem; border-radius:var(--radius); box-shadow:var(--shadow);">
        <h3>Ваш заказ</h3>
        <div id="checkoutItems" style="margin-top:1rem; display:flex; flex-direction:column; gap:1rem;">
          <!-- Items injected via JS -->
        </div>
        <div style="margin-top:2rem; padding-top:1rem; border-top:1px solid var(--color-muted); font-size:1.4rem; font-weight:bold; text-align:right;">
          Итого: <span id="checkoutTotal">$0.00</span>
        </div>
        
        <button type="submit" form="checkoutForm" style="width:100%; padding:1rem; border:none; border-radius:var(--radius); background:linear-gradient(135deg, #1a1f35, #2b3252); color:#fff; font-weight:bold; font-size:1.1rem; cursor:pointer; margin-top:1.5rem; display:flex; align-items:center; justify-content:center; gap:0.5rem; box-shadow:0 4px 10px rgba(0,0,0,0.3);">
          💳 Оплата Visa / Mastercard
        </button>
      </div>
    </div>
  </main>

  <!-- Success Modal -->
  <div class="modal" id="successModal" style="display:none;">
    <div class="modal-content" style="text-align:center;">
      <h2 style="color:var(--color-primary-start); margin-bottom:1rem;">✅ Оплата прошла успешно!</h2>
      <p style="margin-bottom:0.5rem;">Ваш заказ успешно оформлен и передан в обработку.</p>
      <p style="margin-bottom:1.5rem; color:var(--color-muted); font-size:0.9rem;">Уведомление отправлено на ваш Email.</p>
      <a href="index.html" class="checkout-btn" style="display:inline-block; padding:0.8rem 2rem;">Продолжить покупки</a>
    </div>
  </div>

  <script type="module" src="/checkout.js?v=5"></script>
</body>
</html>
