<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout – Brake Discs Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css" />
  <script>
    (function() {
      const savedTheme = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>
  <meta name="description" content="Securely complete your purchase at Brake Discs Store." />
  <link rel="canonical" href="https://brakediscs.com/checkout.html" />

  <meta property="og:title" content="Checkout | Brake Discs Store" />
  <meta property="og:description" content="Securely complete your purchase at Brake Discs Store." />
  <meta property="og:url" content="https://brakediscs.com/checkout.html" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="MotoBrake Discs" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏍️</text></svg>">
</head>
<body>
  <header class="header">
    <h1 class="logo">Brake Discs Store</h1>
    <nav class="nav" style="margin-left:auto;">
      <a href="index.html" class="nav-link">← Return to Shop</a>
    </nav>
  </header>

  <main class="main" style="max-width:1100px; margin:0 auto; padding:0 1rem; display:flex; flex-direction:column; gap:2rem; width:100%;">
    <h2>Checkout</h2>
    
    <div class="checkout-container">
      <div class="checkout-section">
        <h3>Shipping Information</h3>
        <form id="checkoutForm" style="display:flex; flex-direction:column; gap:1rem; margin-top:1rem;">
          <div class="form-row">
            <input type="text" id="chkFirstName" placeholder="First Name" required class="checkout-input" />
            <input type="text" id="chkLastName" placeholder="Last Name" required class="checkout-input" />
          </div>
          <input type="email" id="chkEmail" placeholder="Your Email (for receipt)" required class="checkout-input" />
          <input type="text" id="chkPhone" placeholder="Phone Number" required class="checkout-input" />
          
          <div class="form-row">
            <input type="text" id="chkCountry" placeholder="Country" required class="checkout-input" />
            <input type="text" id="chkCity" placeholder="City" required class="checkout-input" />
          </div>
          <div class="form-row-three">
            <input type="text" id="chkStreet" placeholder="Street" required class="checkout-input" />
            <input type="text" id="chkHouse" placeholder="Building/Apt" required class="checkout-input" />
            <input type="text" id="chkZip" placeholder="ZIP Code" required class="checkout-input" />
          </div>
          <select id="chkPreferredContact" required class="checkout-select">
            <option value="" disabled selected>Preferred Contact Method</option>
            <option value="Telegram">Telegram</option>
            <option value="WhatsApp">WhatsApp</option>
            <option value="Email">Email</option>
            <option value="Phone">Phone</option>
            <option value="Facebook">Facebook</option>
          </select>
          <input type="text" id="chkContactValue" placeholder="" class="checkout-input" style="display:none;" />
          <textarea id="chkComment" rows="3" placeholder="Order comment (optional)" class="checkout-textarea"></textarea>
        </form>
      </div>
      
      <div class="checkout-section" style="display:flex; flex-direction:column; justify-content:space-between;">
        <div>
          <h3>Your Order</h3>
          <div id="checkoutItems" style="margin-top:1rem; display:flex; flex-direction:column; gap:1rem;">
            <!-- Items injected via JS -->
          </div>
        </div>
        <div>
          <div style="margin-top:2rem; padding-top:1rem; border-top:1px solid var(--color-muted); font-size:1.4rem; font-weight:bold; text-align:right;">
            Total: <span id="checkoutTotal">$0.00</span>
          </div>
          
          <button type="submit" form="checkoutForm" style="width:100%; padding:1rem; border:none; border-radius:var(--radius); background:var(--color-header-bg); color:var(--color-text-bright); font-weight:bold; font-size:1.1rem; cursor:pointer; margin-top:1.5rem; display:flex; align-items:center; justify-content:center; gap:0.5rem; box-shadow:0 4px 10px rgba(0,0,0,0.3);">
            💳 Pay with Visa / Mastercard
          </button>
        </div>
      </div>
    </div>
  </main>

  <!-- Success Modal -->
  <div class="modal" id="successModal" style="display:none;">
    <div class="modal-content" style="text-align:center;">
      <div style="font-size:3rem; margin-bottom:0.5rem;">🎉</div>
      <h2 style="color:var(--color-primary-start); margin-bottom:0.5rem;">✅ Payment Successful!</h2>
      <p style="font-size:1.2rem; margin-bottom:0.3rem;">Order <strong id="successOrderId">#0000</strong> placed</p>
      <p style="margin-bottom:0.5rem;">Your order has been successfully placed and is being processed.</p>
      <p style="margin-bottom:1.5rem; color:var(--color-muted); font-size:0.9rem;">A confirmation has been sent to your Email.</p>
      <div style="display:flex; gap:1rem; justify-content:center; flex-wrap:wrap;">
        <a href="index.html" class="checkout-btn" style="display:inline-block; padding:0.8rem 2rem;">Continue Shopping</a>
        <a href="account.html" class="checkout-btn" style="display:inline-block; padding:0.8rem 2rem; background:linear-gradient(135deg, #43a047, #2e7d32);">📋 Go to My Orders</a>
      </div>
    </div>
  </div>

  <script type="module" src="/checkout.js"></script>
  <script>
    function toggleTheme() {
      const root = document.documentElement;
      const newTheme = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
    }
  </script>
</body>
</html>
